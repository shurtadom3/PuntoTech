services:
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,django}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      ENV_TYPE: ${ENV_TYPE:-DEV}
      DB_ENGINE: sqlite3
      #POSTGRES_DB: ${POSTGRES_DB:-puntotech}
      #POSTGRES_USER: ${POSTGRES_USER:-puntotech}
      #POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puntotech}
      #POSTGRES_HOST: db
      #POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      RECOMMENDATION_SERVICE_URL: http://flask-recomendaciones:5000
      ALLIED_SERVICE_URL: ${ALLIED_SERVICE_URL:-}
      EXTERNAL_RATE_API_URL: ${EXTERNAL_RATE_API_URL:-https://api.frankfurter.app/latest}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@puntotech.com}
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker --loglevel=info
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret}
      DEBUG: ${DEBUG:-False}
      ENV_TYPE: ${ENV_TYPE:-DEV}
      DB_ENGINE: sqlite3
      #POSTGRES_DB: ${POSTGRES_DB:-puntotech}
      #POSTGRES_USER: ${POSTGRES_USER:-puntotech}
      #POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puntotech}
      #POSTGRES_HOST: db
      #POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@puntotech.com}
    volumes:
      - ./backend:/app
    depends_on:
      django:
        condition: service_started
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-puntotech}
      POSTGRES_USER: ${POSTGRES_USER:-puntotech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puntotech}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  flask-recomendaciones:
    build:
      context: ./recomendation_service
      dockerfile: Dockerfile
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/staticfiles:ro
    depends_on:
      - frontend
      - django
      - flask-recomendaciones

volumes:
  postgres_data:
  static_volume:
