events {
    worker_connections 1024;
}

http {
    upstream django_backend {
        server django:8000;
    }

    upstream flask_recomendaciones {
        server flask-recomendaciones:5000;
    }

    upstream frontend_app {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Strangler Pattern: recommendations go to Flask.
        location /api/v2/recomendaciones/ {
            proxy_pass         http://flask_recomendaciones;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        location /flask/health {
            proxy_pass http://flask_recomendaciones/health;
        }

        location /api/ {
            proxy_pass         http://django_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        location /static/ {
            alias /staticfiles/;
        }

        location / {
            proxy_pass         http://frontend_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
